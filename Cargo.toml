[workspace]
resolver = "2"
members = ["crates/project-model", "crates/cli", "crates/app", "crates/editor-core", "crates/syntax", "crates/toolchain", "crates/lsp-client", "crates/runner", "crates/dap-client", "crates/jsf", "crates/spring", "crates/vcs", "crates/db", "crates/scaffold"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
anyhow = "1"

# GPUI with Windows shaders compiled when cross-building from Linux (vendor/gpui/build.rs)
[patch.crates-io]
gpui = { path = "vendor/gpui" }
